name: Build and Deploy DinhEuro to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Production Assets
        run: |
          npm run build
        env:
          VITE_FINNHUB_API_KEY: ${{ secrets.VITE_FINNHUB_API_KEY || secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.VITE_FINNHUB_API_KEY }}

      - name: Prepare Static Artifacts for GitHub Pages
        run: |
          # Garante o CNAME para o domínio customizado dinheuro.com
          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          elif [ -f CNAME ]; then
            cp CNAME dist/CNAME
          else
            echo "dinheuro.com" > dist/CNAME
          fi

          # Garante o arquivo .nojekyll para evitar filtragem de arquivos pelo Jekyll
          touch dist/.nojekyll

          # Garante o arquivo 404.html para suportar roteamento SPA no GitHub Pages
          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Deploy to GitHub Pages via peaceiris/actions-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: dinheuro.com
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: false
          allow_empty_commit: false
