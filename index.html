    <script type="text/javascript">
(function() {
  var NativeWS = window.WebSocket;
  if (NativeWS && typeof EventTarget !== 'undefined') {
    class MockViteWS extends EventTarget {
      constructor(url, protocols) {
        if (protocols === 'vite-hmr' || protocols === 'vite-ping' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
          super();
          this.readyState = 1;
          this.url = url;
          this.protocol = protocols || '';
          setTimeout(() => {
            try { this.dispatchEvent(new Event('open')); } catch(e) {}
          }, 10);
        } else {
          return new NativeWS(url, protocols);
        }
      }
      send() {}
      close() {
        this.readyState = 3;
        try { this.dispatchEvent(new Event('close')); } catch(e) {}
      }
    }
    MockViteWS.CONNECTING = 0;
    MockViteWS.OPEN = 1;
    MockViteWS.CLOSING = 2;
    MockViteWS.CLOSED = 3;
    window.WebSocket = MockViteWS;
  }
  var origConsoleError = console.error;
  console.error = function() {
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      var str = (a && (a.message || a.stack || String(a))) || '';
      if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('Illegal invocation') !== -1) {
        return;
      }
    }
    return origConsoleError.apply(console, arguments);
  };
})();
</script>

      (function() {
        // Se este index.html estiver sendo executado diretamente em produção sem Vite

        var hasVite = window.__vite_plugin_react_preamble_installed__ || window.location.port === '3000' || window.location.hostname === 'localhost';
        
        window.addEventListener('error', function(e) {
          var target = e && e.target;
          var isMainTsx = target && target.src && target.src.indexOf('main.tsx') !== -1;
          var isSyntaxErr = e && e.message && (e.message.indexOf('SyntaxError') !== -1 || e.message.indexOf('MIME') !== -1);
          
          if (isMainTsx || (isSyntaxErr && !hasVite)) {
            // Tenta abrir a versão compilada /dist/ automaticamente
            if (window.location.pathname.indexOf('/dist') === -1) {
              fetch('/dist/index.html', { method: 'HEAD' })
                .then(function(res) {
                  if (res.ok) {
                    window.location.replace('/dist/' + window.location.search);

                    renderServerGuidance();
                  }
                })
                .catch(function() {
                  renderServerGuidance();
                });
