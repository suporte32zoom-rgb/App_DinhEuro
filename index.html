<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>DinhEuro - Hub Financeiro Global</title>
    <script>
      // Suppress benign Vite HMR WebSocket connection closure in cloud container environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (typeof event.reason === 'string' || event.reason.message)) {
          var msg = event.reason.message || String(event.reason);
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            event.preventDefault();
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.preventDefault();
        }
      });
    </script>
    <meta name="description" content="Plataforma e hub financeiro global com cotações em tempo real, simulador de câmbio universal, ações mundiais e B3, cripto, carteiras e análises de mercado." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0B1320" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DinhEuro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="DinhEuro - Hub Financeiro Global" />
    <meta property="og:description" content="Plataforma e hub financeiro global com cotações em tempo real, simulador de câmbio universal, ações mundiais e B3, cripto, carteiras e análises de mercado." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DinhEuro - Hub Financeiro Global" />
    <meta name="twitter:description" content="Plataforma e hub financeiro global com cotações em tempo real, simulador de câmbio universal, ações mundiais e B3, cripto, carteiras e análises de mercado." />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- Google Fonts for Financial UI (Inter + JetBrains Mono for figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b1320] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen overflow-x-hidden font-sans">
    <div id="root">
      <!-- Pre-mount loading screen: eliminates blank blue screen during bundle load -->
      <div id="dinheuro-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B1320; color: #F8FAFC; font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; width: 68px; height: 68px; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(16, 185, 129, 0.15);"></div>
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #10B981; animation: dinheuro-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #10B981;">€</div>
        </div>
        <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 8px;">
          <span style="color: #10B981;">Dinh</span><span style="color: #FFFFFF;">Euro</span>
        </div>
        <div style="font-size: 13px; font-weight: 500; color: #94A3B8; letter-spacing: 0.3px; max-width: 380px; line-height: 1.5; margin-bottom: 12px;">
          Hub Financeiro Global em Tempo Real
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 9999px; font-size: 11px; color: #34D399; font-weight: 600;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #10B981; display: inline-block;"></span>
          Sincronizando cotações globais
        </div>
      </div>
    </div>
    <style>
      @keyframes dinheuro-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Registro defensivo e assíncrono do Service Worker (PWA dinheuro-v2-cache) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('[DinhEuro PWA] Service Worker registrado:', registration.scope);
            })
            .catch(function(err) {
              console.warn('[DinhEuro PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
